<html>

<head>
    <style>
        *{
            margin: 0;
            padding: 0;
            border: 0;
            box-sizing: border-box;
            font-family: "Rye", serif;
            font-weight: 400;
            font-style: normal;
            
        }
        :root{
            overflow-y: hidden;
        }
        #main {
            width: 100%;
            height: 100%;
            background-color: lightblue;
            display: flex;
            align-items: center;
            align-content: center;
            justify-content: center;
            z-index: 4;
        }
        #trolley_div {
            width: 1000px;
            height: 500px;
            position: relative;
            align-items: center;
            align-content: center;
            justify-content: center;
            background-color: lightcyan;
            background-position: center;
        }
        #rails {
            position: absolute;
            display: flex;
            width: 1000px;
            height: 100px;
            background-image: url('straighttrack.png');
            background-repeat:repeat-x;
            background-position: center;
            /* background-color: blue; */
        }
        #railsplit {
            position: absolute;
            display: flex;
            left:50%;
            width: 180px;
            height: 150px;
            background-image: url('righttrack.png');
            background-position: center;
            background-position-y: 63%;
            /* background-color: blue; */
        }
        #bottomrails {
            position: absolute;
            display: flex;
            top: 60%;
            left:67.9%;
            width: 321px;
            height: 100px;
            background-image: url('straighttrack.png');
            background-repeat:repeat-x;
            background-position-y: center;
            background-position-x: left;
            z-index: 2;
            /* background-color: blue; */
        }
    </style>
</head>

<body>
    <div id='main'>
        <div id='trolley_div'>
            <div id='rails'>
            </div>
            <div id='railsplit'>
            </div>
            <div id='bottomrails'>
            </div>
        </div>
    </div>
</body>

</html>
