<html>

<head>
    <style>
        *{
            margin: 0;
            padding: 0;
            border: 0;
            box-sizing: border-box;
            font-family: "Rye", serif;
            font-weight: 400;
            font-style: normal;
            
        }
        :root{
            overflow-y: hidden;
        }
        #main {
            width: 100%;
            height: 100%;
            background-color: lightblue;
            display: flex;
            align-items: center;
            align-content: center;
            justify-content: center;
            z-index: 4;
        }
        #trolley_div {
            width: 1000px;
            height: 500px;
            position: relative;
            align-items: center;
            align-content: center;
            justify-content: center;
            background-color: lightcyan;
            background-position: center;
            background-image: url("background.png");
            background-size: cover;
        }
        #rails {
            position: absolute;
            display: flex;
            width: 1000px;
            height: 100px;
            background-image: url('straighttrack.png');
            background-repeat:repeat-x;
            background-position: center;
            top:40%
            /* background-color: blue; */
        }
        #railsplit {
            position: absolute;
            display: flex;
            left:32%;
            width: 180px;
            height: 150px;
            background-image: url('righttrack.png');
            background-position: center;
            background-position-y: 93%;
            /* background-color: blue; */
        }
        #bottomrails {
            position: absolute;
            display: flex;
            top: 50%;
            left:50%;
            width: 500px;
            height: 100px;
            background-image: url('straighttrack.png');
            background-repeat:repeat-x;
            background-position-y: center;
            background-position-x: left;
            z-index: 2;
            /* background-color: blue; */
        }
        #train{
            transform: scaleX(-.14) scaleY(.15);
            position: absolute;
            display: flex;
            top: -38%;
            left:-55%;
            width: 1400px;
            height: 800px;
            background-image: url('train.png');
            background-position-y: center;
            background-position-x: left;
            z-index: 1;
            /* background-color: blue; */
        }
        #bloodytrain{
            transform: scaleX(-.14) scaleY(.15);
            position: absolute;
            display: flex;
            top: -38%;
            left:-35%;
            width: 1400px;
            height: 800px;
            background-image: url('bloodytrain.png');
            background-position-y: center;
            background-position-x: left;
            z-index: 1;
            /* background-color: blue; */
        }
    </style>
</head>

<body>
    <div id='main'>
        <div id='trolley_div'>
            <div id='rails'>
            </div>
            <div id='railsplit'>
            </div>
            <div id='bottomrails'>
            </div>
            <div id='train'>
            </div>
            <div id='bloodytrain'>
            </div>

        </div>
    </div>
</body>

</html>
